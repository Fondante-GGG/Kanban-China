## Безопасность и качество

- Backend авторитетен для прав, складского scope, валидации и переходов статуса.
  Frontend не обходит права и недокументированное поведение API.
- Защищать кадровые, финансовые и геолокационные данные; проверять права на
  вложения/экспорт при каждом запросе. Не писать secrets, токены и персональные
  данные в код, примеры, логи и отчёты. Примеры конфигураций — без настоящих ключей.
- Писать поддерживаемый типизированный код, документацию и уместные unit,
  integration и contract-тесты. Проверять повторные запросы, гонки, откаты,
  отказ внешних зависимостей, авторизацию и валидацию там, где это существенно.
- Новые пользовательские тексты: русский, кыргызский, Simplified Chinese и
  Traditional Chinese. Проверять mobile, keyboard/a11y и контраст обеих тем.
- Выполнять релевантные тесты/lint/typecheck; не отключать проверки ради зелёного
  pipeline. Записывать точные команды, результаты и пропуски. Mock API не равен
  реальному end-to-end; SQLite не подтверждает конкурентность PostgreSQL.
- Документировать миграции, breaking changes и rollback/rollout ограничения.
  Контракты, авторизация, аудит и обработка ошибок входят в определение готовности.
- Готовность: критерии приёмки выполнены, нужные проверки прошли, контракты
