## Разрешения и отчёт пользователю

- Не делать commit, push, публикацию PR/внешних сообщений, deploy, удаление данных,
  разрушительные DB-операции или изменения внешних сервисов без явного разрешения.
  Review-ready patch можно подготовить локально без публикации.
- Без разрешения на конкретную внешнюю операцию сначала завершить разрешённые
