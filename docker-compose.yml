services:
  db:
    image: postgres:16-alpine
    container_name: yrys_kanban_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: kanban_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kanban_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: yrys_kanban_backend
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: kanban-secret-key-super-secure-jwt-2026-production
      DJANGO_DEBUG: "True"
      ALLOWED_HOSTS: "*"
      POSTGRES_DB: kanban_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword2026
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "8080:8080"
    volumes:
      - backend_media:/app/backend/media
      - backend_private_media:/app/backend/private_media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api
    container_name: yrys_kanban_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
    ports:
      - "3001:3001"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_media:
  backend_private_media:
